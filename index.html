<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Gestão | Organize sua vida financeira sem complicação</title>
    <meta name="description" content="O controle que você precisa, na velocidade que você vive. O Nexus Gestão simplifica tudo em um só lugar. Comece agora grátis." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Restores SPA route when GitHub Pages redirects unknown paths to /?p=...
      (function () {
        var q = window.location.search;
        if (q && q.indexOf('?p=') === 0) {
          var path = q
            .slice(3)
            .replace(/~and~/g, '&')
            .replace(/%2F/g, '/');
          window.history.replaceState(null, '', path + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
